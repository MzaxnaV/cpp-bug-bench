[project]
name = "cpp-bug-bench"
version = "0.1.0"
description = "Tests LLMs on finding C++ bugs and proving them with sanitizer tests"
readme = "README.md"
authors = [
    { name = "Manav", email = "30342951+MzaxnaV@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
cpp-bug-bench = "cpp_bug_bench:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
